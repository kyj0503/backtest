name: backtest-memory

x-environment: &environment
  DEBUG: "true"
  TURNSTILE_ENABLED: "false"
  LOG_LEVEL: INFO
  DATABASE_PORT: "3306"
  DATABASE_NAME: stock_data_cache
  DATABASE_USER: compare
  DATABASE_PASSWORD: comparison-local-app
  NAVER_CLIENT_ID: ""
  NAVER_CLIENT_SECRET: ""
  MAX_CONCURRENT_BACKTESTS: "8"
  MAX_CONCURRENT_BACKTESTS_PER_CLIENT: "2"

x-resources: &resources
  resources:
    limits:
      cpus: "2"
      memory: 2G

services:
  memory-python-api:
    container_name: backtest-memory-python-api-1
    image: backtest-compare-python-api:local
    environment:
      <<: *environment
      DATABASE_HOST: mysql-python
      DATABASE_URL: mysql+pymysql://compare:comparison-local-app@mysql-python:3306/stock_data_cache?charset=utf8mb4
    deploy: *resources
    networks:
      default:
        aliases: [memory-python-api]

  memory-rust-api:
    container_name: backtest-memory-rust-api-1
    image: backtest-compare-rust-api:local
    environment:
      <<: *environment
      DATABASE_HOST: mysql-rust
      DATABASE_URL: mysql://compare:comparison-local-app@mysql-rust:3306/stock_data_cache
    deploy: *resources
    networks:
      default:
        aliases: [memory-rust-api]

networks:
  default:
    external: true
    name: backtest-compare_default
