global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 호스트 머신에서 실행 중인 프로젝트들 (Docker 포트 포워딩을 통해 접근)
  - job_name: 'backtest_backend'
    metrics_path: '/metrics'
    static_configs:
      # host.docker.internal은 Docker 컨테이너 내부에서 호스트 머신(localhost)을 가리킴
      - targets: ['host.docker.internal:8000']
    metric_relabel_configs:
      - source_labels: [job]
        target_label: app_name
