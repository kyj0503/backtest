name: backtest-${APP_ENV:?}

services:
  app:
    image: ${APP_IMAGE:?}
    container_name: ${APP_CONTAINER:?}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    env_file:
      - path: ${APP_ENV_FILE:?}
        required: true
        format: raw
    networks:
      - backend-net
    volumes:
      - /opt/backtest/production/tls:/app/tls:ro
    healthcheck:
      # distroless 런타임에는 curl이 없다. 서버 바이너리가 직접 조회한다.
      test: [CMD, /app/server, -healthcheck, /health]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

networks:
  backend-net:
    external: true
