name: backtest-dev

services:
  backtest-be-fast:
    build:
      context: ./backtest_be_fast
      dockerfile: Dockerfile.dev
    image: backtest-be-fast:dev
    container_name: backtest-be-fast-dev
    networks:
      - backtest-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEBUG=true
    volumes:
      - ./backtest_be_fast:/app
      - backtest_be_fast_venv:/opt/venv
    # 런타임에 venv 의존성 동기화 후 서버 시작 (이미지와 볼륨의 동기화 보장)
    command: >
      sh -c "pip install -r requirements.txt && 
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --limit-concurrency 100 --backlog 200"
  backtest-fe:
    build:
      context: ./backtest_fe
      dockerfile: Dockerfile.dev
    image: backtest-fe:dev
    container_name: backtest-fe-dev
    networks:
      - backtest-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backtest-be-fast:
        condition: service_started
    ports:
      - "5173:5173"
    volumes:
      - ./backtest_fe:/app
      - backtest_fe_node_modules:/app/node_modules
    env_file:
      - .env
    environment:
      - "VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api}"
      - "API_PROXY_TARGET=${API_PROXY_TARGET:-http://backtest-be-fast:8000}"
      - "FASTAPI_PROXY_TARGET=${FASTAPI_PROXY_TARGET:-http://backtest-be-fast:8000}"
    # 런타임에 node_modules 동기화 후 vite 시작
    command: [ "sh", "-c", "npm install && npm run dev" ]

volumes:
  backtest_fe_node_modules:
  backtest_be_fast_venv:


networks:
  backtest-net:
    name: backtest-network
