name: backtest-dev

services:
  backtest-be-fast:
    build:
      context: ./backtest_be_fast
      dockerfile: Dockerfile.dev
    image: backtest-be-fast:dev
    container_name: backtest-be-fast-dev
    networks:
      - backtest-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEBUG=true
      - WATCHFILES_FORCE_POLLING=false
    volumes:
      - ./backtest_be_fast:/app
      - backtest_be_fast_venv:/opt/venv
    depends_on:
      mysql:
        condition: service_healthy
    # 런타임에 venv 의존성 동기화 후 서버 시작 (이미지와 볼륨의 동기화 보장)
    command: >
      sh -c "pip install -r requirements.txt &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app --limit-concurrency 100 --backlog 200"
  mysql:
    image: mysql:8.0
    container_name: backtest-mysql-dev
    networks:
      - backtest-net
    ports:
      - "3306:3306"
    env_file:
      - .env
    environment:
      - MYSQL_DATABASE=stock_data_cache
      # mysql 이미지는 root 비밀번호가 없으면 기동 자체가 실패한다.
      # .env에 MYSQL_* 키가 없어도 뜨도록 로컬 개발용 기본값을 둔다.
      # (.env 파일 자체는 env_file 지시자 때문에 반드시 존재해야 한다)
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-localroot123}
      # DATABASE_USER/DATABASE_PASSWORD와 반드시 일치해야 BE가 접속할 수 있다.
      - MYSQL_USER=${MYSQL_USER:-appuser}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-appuser123}
    volumes:
      - backtest_mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backtest-fe:
    build:
      context: ./backtest_fe
      dockerfile: Dockerfile.dev
    image: backtest-fe:dev
    container_name: backtest-fe-dev
    networks:
      - backtest-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backtest-be-fast:
        condition: service_started
    ports:
      - "5173:5173"
    volumes:
      - ./backtest_fe:/app
      - backtest_fe_node_modules:/app/node_modules
    env_file:
      - .env
    environment:
      - "VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api}"
      - "API_PROXY_TARGET=${API_PROXY_TARGET:-http://backtest-be-fast:8000}"
      - "FASTAPI_PROXY_TARGET=${FASTAPI_PROXY_TARGET:-http://backtest-be-fast:8000}"
    # 런타임에 node_modules 동기화 후 vite 시작
    command: [ "sh", "-c", "npm install && npm run dev" ]

volumes:
  backtest_mysql_data:
  backtest_fe_node_modules:
  backtest_be_fast_venv:


networks:
  backtest-net:
    name: backtest-network
