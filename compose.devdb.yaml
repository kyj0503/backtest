name: backtest-devdb

# 로컬 검증용 DB: 운영(OCI 관리형 MySQL)의 일회성 복사본을 담는다(docs/go-migration-plan.md 0.5).
#
# 원격 DB는 덤프할 때 한 번 읽기만 하고, 이후 검증은 이 복사본으로만 한다.
# 덤프 적재와 마이그레이션 리허설은 scripts/load-devdb.sh가 한다.
#
# - 포트는 127.0.0.1:3307에만 연다(compose.dev.yaml의 개발 DB 3306과 겹치지 않게).
# - 이름 있는 볼륨 backtest-devdb에 보관한다. 볼륨을 지우지 않는다(`down -v` 금지).
# - Go 서버를 이 DB에 붙일 때는 같은 네트워크(backtest-network)에서 DATABASE_HOST=devdb를 쓴다.
services:
  devdb:
    image: mysql:8.4
    container_name: backtest-devdb
    environment:
      MYSQL_ROOT_PASSWORD: ${DEVDB_ROOT_PASSWORD:-devdb-root-local}
      MYSQL_DATABASE: stock_data_cache
      MYSQL_USER: ${DEVDB_USER:-appuser}
      MYSQL_PASSWORD: ${DEVDB_PASSWORD:-appuser123}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - backtest-devdb:/var/lib/mysql
    networks:
      - backtest-net
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  backtest-devdb:
    name: backtest-devdb

networks:
  # compose.dev.yaml이 만든 네트워크를 같이 쓴다(먼저 `docker compose -f compose.dev.yaml up -d mysql`).
  backtest-net:
    name: backtest-network
    external: true
