server {
  listen 80;
  server_name _;

  # Serve static files
  root /usr/share/nginx/html;
  index index.html;

  # Frontend SPA routing
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Lightweight health endpoint for external checks
  location /health {
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # 정의되지 않은 /api/* 경로는 SPA fallback(HTML 200)이 삼키지 않도록 404 반환
  location /api/ {
    return 404;
  }

  # FastAPI 백테스트 API (Docker 네트워크 내부 서비스)
  # location에 트레일링 슬래시를 붙이면 슬래시 없는 POST /api/v1/backtest가
  # 301로 리다이렉트되고 브라우저가 POST→GET 변환해 405가 된다.
  # proxy_pass에 URI를 붙이지 않아야 원본 URI가 그대로 전달된다.
  location /api/v1/backtest {
    proxy_pass http://backtest-be:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
  }
}
