server {
  listen 80;
  server_name _;

  # Serve static files
  root /usr/share/nginx/html;
  index index.html;

  # 보안 헤더 (서버 레벨). nginx는 어떤 location이 자체 add_header를 가지면 그
  # location에는 상위(서버 레벨) add_header가 전혀 상속되지 않으므로, 아래
  # /health location에는 동일한 헤더를 별도로 재선언한다.
  # always를 붙여 200/301/302 등 "정상" 목록 밖의 응답(예: /api/ 의 404)에도
  # 적용되게 한다.
  server_tokens off;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # Vite SPA, 자기 origin만 호출. style-src에 'unsafe-inline'이 필요한 이유:
  # shadcn/ui가 감싸는 Radix Dialog/DropdownMenu/Select 등이 내부적으로
  # react-remove-scroll(스크롤 잠금)을 사용하는데, 이 라이브러리가 nonce 없이
  # document.head에 <style> 태그를 동적으로 삽입한다(빌드 산출물의
  # index-*.js에서 confirmed: e=document.createElement("style") 후 cssText
  # 대입). 앱에 nonce가 배선되어 있지 않아 style-src에서 'unsafe-inline'을
  # 빼면 모달/드롭다운/셀렉트를 열 때마다 콘솔 에러와 함께 스크롤 잠금이
  # 깨진다. script-src는 인라인 스크립트/eval이 전혀 없어 'self'만으로 충분.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;

  # P3-13: gzip 압축. base nginx.conf(이미지 기본)는 gzip이 꺼져 있고 이 리포는
  # 그 파일을 건드릴 수 없으므로 서버 레벨에서 켠다. text/html은 gzip 모듈이
  # gzip_types 나열 여부와 무관하게 항상 압축 대상에 포함한다.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml+rss
    application/atom+xml
    image/svg+xml
    font/ttf
    font/otf
    application/font-woff
    application/font-woff2;

  # Frontend SPA routing
  location / {
    try_files $uri $uri/ /index.html;
  }

  # P3-13: Vite가 콘텐츠 해시를 파일명에 넣어 내보내는 번들(js/css 등)이 있는
  # 경로 — 같은 URL이 다시 나오면 반드시 내용도 같으므로 1년 장기 캐시 +
  # immutable이 안전하다. index.html 등 해시 없는 정적 파일은 위 location /
  # 의 기본 캐싱(무캐시에 가까움)을 그대로 따른다.
  #
  # 이 location이 자체 add_header(Cache-Control)를 가지므로 서버 레벨 보안
  # 헤더가 상속되지 않는다 (파일 상단 설명과 동일한 nginx add_header 상속
  # 규칙) — /health와 마찬가지로 재선언한다.
  location /assets/ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Lightweight health endpoint for external checks
  location /health {
    # 이 location이 자체 add_header(Content-Type)를 가지므로 위 서버 레벨
    # 보안 헤더가 상속되지 않는다 (nginx add_header 상속 규칙). 재선언한다.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # 정의되지 않은 /api/* 경로는 SPA fallback(HTML 200)이 삼키지 않도록 404 반환
  location /api/ {
    return 404;
  }

  # FastAPI 백테스트 API (호스트 네트워크에서 8000 포트로 서비스)
  # location에 트레일링 슬래시를 붙이면 슬래시 없는 POST /api/v1/backtest가
  # 301로 리다이렉트되고 브라우저가 POST→GET 변환해 405가 된다.
  # proxy_pass에 URI를 붙이지 않아야 원본 URI가 그대로 전달된다.
  location /api/v1/backtest {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
  }
}
