[package]
name = "backtest-server"
version = "1.7.10"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"

[dependencies]
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
html-escape = "0.3.1"
ipnet = "2"
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "form", "rustls"] }
scraper = "0.29.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Use only the MySQL driver; the umbrella crate locks unused SQLite drivers too.
# Pin both components together because the runtime/TLS feature names are internal.
sqlx-core = { version = "=0.9.0", default-features = false, features = ["_rt-tokio", "_tls-rustls-ring-webpki", "chrono", "json"] }
sqlx-mysql = { version = "=0.9.0", default-features = false, features = ["chrono", "json"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["trace", "catch-panic"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
yahoo_finance_api = { version = "=5.0.0", features = ["governor"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
strip = true

