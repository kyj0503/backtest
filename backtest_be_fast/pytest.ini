[pytest]
# 테스트 경로 설정
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 비동기 테스트 지원
asyncio_mode = strict

# 마커 정의
markers =
    unit: Unit tests - fast, isolated tests (단위 테스트 - 빠르고 독립적)
    integration: Integration tests - tests with external dependencies (통합 테스트 - 외부 의존성 포함)
    e2e: End-to-end tests - full workflow tests (E2E 테스트 - 전체 워크플로우)
    slow: Slow running tests (느린 테스트)
    db: Tests that require database (데이터베이스 필요)
    external: Tests that call external APIs (외부 API 호출)

# 출력 설정
# -m 기본값: bare `pytest`(인자 없이)가 tests/ 전체를 testpaths로 수집할 때
# integration/e2e/external까지 끌고 와 로컬에서 DB/네트워크 없이 실행하면 깨졌다
# (P3-01). CI는 `pytest tests/unit -q`처럼 경로로 이미 걸러서 실행하지만,
# 마커로도 한 번 더 걸러야 `pytest -m unit`이 절반 이하만 도는 문제가 함께
# 해결된다. 명시적으로 `-m e2e`/`-m integration`을 주면 이 기본값을 덮어쓴다
# (pytest는 addopts에 이미 있는 -m을 커맨드라인의 나중 -m으로 치환한다).
addopts =
    -ra
    --strict-markers
    --strict-config
    --showlocals
    --tb=short
    -v
    -m "not integration and not e2e and not external"

# 경고 필터
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# 로깅 설정
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 커버리지 설정: coverage.py는 pytest.ini의 [coverage:*] 섹션을 읽지 않는다
# (.coveragerc / setup.cfg / pyproject.toml만 읽음). P3-03 — .coveragerc로 이동.
