name: backtest-dev-prod

# 실제 운영 이미지(backtest_be_go/Dockerfile의 runtime 스테이지)를 로컬에서 검증한다.
#
# 소스 바인드 마운트가 없다. 운영과 같은 정적 바이너리·distroless 이미지를 그대로 실행하므로, 코드를
# 바꿨다면 `docker compose -f compose.dev-prod.yaml build backtest-be`로 다시 빌드해야 반영된다.
#
# MySQL 서비스가 없다. compose.dev.yaml의 mysql이 먼저 떠 있어야 하고, 두 파일이 같은 외부 네트워크
# "backtest-network"를 공유해 서비스 이름 mysql로 접속한다. 개발 API(compose.dev.yaml의 backtest-be)와
# 포트가 겹치므로 그쪽을 먼저 멈춘다:
#   docker compose -f compose.dev.yaml stop backtest-be
#   docker compose -f compose.dev-prod.yaml up -d --build
# 보관할 DB가 있는 볼륨에 `down -v`를 실행하지 않는다.
#
# 프론트엔드는 별도 저장소(backtest-console)에 있다. 콘솔의 Vite 프록시 기본 대상
# http://backtest-be-fast:8000 을 그대로 쓰도록 같은 네트워크 별칭을 둔다.

services:
  backtest-be:
    build:
      context: ./backtest_be_go
      target: runtime
    image: backtest-be-go:dev-prod
    container_name: backtest-be-dev-prod
    networks:
      backtest-net:
        aliases:
          - backtest-be-fast
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - DEBUG=false
      - MAX_CONCURRENT_BACKTESTS=${MAX_CONCURRENT_BACKTESTS:-8}
      - BACKTEST_TIMEOUT_SECONDS=${BACKTEST_TIMEOUT_SECONDS:-60}
      - BACKTEST_QUEUE_TIMEOUT_SECONDS=${BACKTEST_QUEUE_TIMEOUT_SECONDS:-30}
      - MAX_CONCURRENT_BACKTESTS_PER_CLIENT=${MAX_CONCURRENT_BACKTESTS_PER_CLIENT:-2}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 128M

networks:
  backtest-net:
    name: backtest-network
    external: true
