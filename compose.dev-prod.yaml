name: backtest-dev-prod

# Build the Rust release image without source mounts. Start the development
# MySQL first: docker compose -f compose.dev.yaml up -d mysql
# Stop the development API before binding its port with this stack.
services:
  backtest-be:
    build:
      context: ./backtest_be_rust
      target: runtime
    image: backtest-be-rust:dev-prod
    container_name: backtest-be-rust-dev-prod
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      DEBUG: "false"
      TURNSTILE_ENABLED: ${TURNSTILE_ENABLED:-false}
      MAX_CONCURRENT_BACKTESTS: ${MAX_CONCURRENT_BACKTESTS:-8}
      BACKTEST_TIMEOUT_SECONDS: ${BACKTEST_TIMEOUT_SECONDS:-60}
      BACKTEST_QUEUE_TIMEOUT_SECONDS: ${BACKTEST_QUEUE_TIMEOUT_SECONDS:-30}
      MAX_CONCURRENT_BACKTESTS_PER_CLIENT: ${MAX_CONCURRENT_BACKTESTS_PER_CLIENT:-2}
    networks:
      - backtest-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
networks:
  backtest-net:
    external: true
    name: backtest-network
