# OCI development DB only. Never use this file to manage the production DB.
name: backtest-database-development
services:
  mysql:
    image: mysql:8.4
    container_name: backtest-db-dev
    restart: unless-stopped
    mem_limit: 1g
    cpus: '1.0'
    env_file:
      - path: ${DATABASE_ENV_FILE:?}
        required: true
        format: raw
    volumes:
      - mysql-data:/var/lib/mysql
      - ${DATABASE_SCHEMA_FILE:?}:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - backend-net
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, 127.0.0.1]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
volumes:
  mysql-data:
    name: backtest-development-mysql
networks:
  backend-net:
    external: true
